name: Build DayFlow (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dayflow.py"
      - "requirements.txt"
      - "tools/generate_icon.py"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pip-licenses
          pip-licenses --format=markdown --with-urls --output-file=THIRD_PARTY_LICENSES.md
      - name: Generate app icon
        run: python tools/generate_icon.py
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --icon assets/dayflow.ico --add-data "assets/dayflow.ico;." --add-data "THIRD_PARTY_NOTICES.md;." --add-data "THIRD_PARTY_LICENSES.md;." --collect-all certifi --collect-all customtkinter --name DayFlow dayflow.py
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DayFlow-Windows
          path: dist/DayFlow/DayFlow.exe
