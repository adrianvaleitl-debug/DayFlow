name: Build and release DayFlow

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "dayflow.py"
      - "requirements.txt"
      - "tools/generate_icon.py"
      - "installer/DayFlow.iss"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: dayflow-windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile dayflow.py
      - name: Generate DayFlow icon
        run: python tools/generate_icon.py
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon assets/dayflow.ico --add-data "assets/dayflow.ico;." --add-data "assets/dayflow.png;." --collect-all certifi --collect-all customtkinter --name DayFlow dayflow.py
      - name: Smoke test packaged desktop app
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/DayFlow.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "DayFlow exited during startup smoke test" }
          Stop-Process -Id $app.Id -Force
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\DayFlow.iss
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          name: DayFlow v${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: release/DayFlow-Setup-*.exe
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayFlow-Windows-Installer
          path: release/DayFlow-Setup-*.exe
