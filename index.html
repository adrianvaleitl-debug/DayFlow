<style>
:root{color-scheme:dark;--bg:#0c111b;--panel:#151e2c;--line:#263449;--text:#f4f7fc;--muted:#a2afc2;--blue:#75b7ff}

.hero{padding:105px 0 95px;display:grid;grid-template-columns:1.1fr .9fr;gap:55px;align-items:center}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(48px,6vw,76px);line-height:1.04;letter-spacing:-.055em;margin:18px 0 22px}.gradient{background:linear-gradient(100deg,#fff,#83baff 60%,#9b9cff);background-clip:text;color:transparent}.lead{font-size:19px;color:var(--muted);max-width:580px}.actions{display:flex;gap:13px;flex-wrap:wrap;margin-top:32px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 21px;border-radius:12px;font-weight:750;font-size:14px;background:linear-gradient(110deg,#5c9be9,#6978ed);color:white;box-shadow:0 10px 32px #547fca30}.btn.secondary{background:var(--panel);border:1px solid var(--line);box-shadow:none}.small{color:var(--muted);font-size:12px;margin-top:14px}

/* DayFlow 1.1: a personal planning canvas, not a business dashboard. */
body{background:radial-gradient(ellipse at 50% -15%,#233c5e 0,transparent 46%),linear-gradient(180deg,#0b111c,#101a29 60%,#0d1420)}
.wrap{max-width:1160px}
.nav{height:76px;position:sticky;top:10px;z-index:20;background:rgba(18,27,42,.86);backdrop-filter:blur(18px);border:1px solid #ffffff16;border-radius:22px;padding:0 22px;margin-top:10px}
.hero{display:flex;flex-direction:column;text-align:center;align-items:center;gap:34px;padding:76px 0 72px}
.hero>div:first-child{max-width:850px}
.hero h1{font-size:clamp(54px,7vw,88px);margin:15px 0 18px}
.lead{max-width:760px;margin:0 auto;font-size:20px}
.actions{justify-content:center}
.mock{width:100%;max-width:1050px;transform:none;border-radius:32px;padding:25px;background:linear-gradient(145deg,#1d304b,#121d2d);border-color:#3b5271;box-shadow:0 38px 100px #0009;text-align:left}
.mocktop{padding-bottom:13px;border-bottom:1px solid #ffffff16}
.mocktitle{font-size:28px}.mocksub{font-size:14px}
.stats{gap:14px}.stat{border-radius:18px;padding:18px}.tasks{grid-template-columns:repeat(3,1fr);gap:12px}.task{border-radius:16px;padding:17px;min-height:72px}
.section{padding:78px 0;border-top:1px solid #ffffff12}
.features{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:34px}
.feature{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:start;border-radius:22px;padding:25px;background:linear-gradient(145deg,#17263a,#121d2d);border-color:#30435d;min-height:140px}
.feature .ico{grid-row:1/3;width:46px;height:46px;border-radius:15px;background:#233b59;display:grid;place-items:center}
.feature h3{margin:2px 0 6px}.feature p{margin:0}
.download{border-radius:32px;padding:50px;background:linear-gradient(125deg,#1b3553,#242c55 60%,#1a2641);border-color:#3b5271}
.footer{border-top:1px solid #ffffff13;margin-top:60px}
@media(max-width:800px){.hero{padding:52px 0}.tasks{grid-template-columns:1fr}.features{grid-template-columns:1fr}.mock{padding:16px}.nav{height:auto;min-height:68px;flex-wrap:wrap;gap:10px;padding:12px 16px}}

<main><section class="hero"><div><div class="eyebrow">A clearer way to get things done</div><h1>Your day.<br><span class="gradient">Under control.</span></h1><p class="lead">Bring tasks, routines, notes and goals into one calm workspace. DayFlow helps you make a plan, focus on what matters and see your progress — with weekly reviews, habit streaks and a smoother Windows update experience.</p><div class="actions"><a class="btn" id="downloadButton" href="https://github.com/adrianvaleitl-debug/DayFlow/releases/latest">Download for Windows</a><a class="btn secondary" href="#features">Explore features</a></div><div class="small" id="releaseNote">DayFlow 1.3.1 · Windows desktop · Free · Your data stays on your device</div></div>

<section class="section" id="features"><div class="eyebrow">Everything in one place</div><h2>Less juggling. More doing.</h2><p>A practical toolkit for your everyday life, without the clutter.</p><div class="features">

<script>document.getElementById("year").textContent=new Date().getFullYear();(async()=>{try{const r=await fetch("https://api.github.com/repos/adrianvaleitl-debug/DayFlow/releases/latest");if(!r.ok)throw 0;const d=await r.json();const version=(d.tag_name||"").replace(/^v/i,"");const expected=`dayflow-setup-${version}.exe`.toLowerCase();const a=(d.assets||[]).find(x=>x.name.toLowerCase()===expected);if(a){for(const id of ["downloadButton","downloadButton2"]){const b=document.getElementById(id);b.href=a.browser_download_url;b.setAttribute("download",a.name)}document.getElementById("releaseNote").textContent=(d.tag_name||"Latest release")+" · Windows installer · Free · Your data stays on your device";}}catch(e){}})();</script>
<script id="adrian-theme-controls">
(()=>{const root=document.documentElement,key='av-theme-'+location.pathname;let mode='dark',accent='euro';try{mode=localStorage.getItem(key+'-mode')||mode;accent=localStorage.getItem(key+'-accent')||accent}catch{}const valid=['dollar','euro','pound','yen','franc'];function apply(){root.dataset.avMode=mode;root.dataset.avAccent=valid.includes(accent)?accent:'euro';document.querySelector('meta[name="theme-color"]')?.setAttribute('content',mode==='dark'?'#171820':'#f5f3f0');const mb=document.getElementById('av-mode');if(mb){mb.textContent=mode==='dark'?'☀ Light':'☾ Dark';mb.setAttribute('aria-pressed',String(mode==='light'))}document.querySelectorAll('[data-av-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.avChoice===accent)))}function persist(){try{localStorage.setItem(key+'-mode',mode);localStorage.setItem(key+'-accent',accent)}catch{}apply()}const tools=document.createElement('div');tools.className='av-theme-tools';tools.setAttribute('aria-label','Appearance settings');tools.innerHTML='<button id="av-mode" type="button">☀ Light</button>'+[['dollar','#e8c98f','Dollar'],['euro','#9ebce9','Euro'],['pound','#c4afe7','Pound'],['yen','#e9aebc','Yen'],['franc','#9fcbd0','Franc']].map(([n,col,label])=>'<button type="button" data-av-choice="'+n+'"><i class="av-dot" style="background:'+col+'"></i>'+label+'</button>').join('');const nav=document.querySelector('.nav');if(nav)nav.append(tools);else document.body.prepend(tools);document.getElementById('av-mode').addEventListener('click',()=>{mode=mode==='dark'?'light':'dark';persist()});tools.querySelectorAll('[data-av-choice]').forEach(b=>b.addEventListener('click',()=>{accent=b.dataset.avChoice;persist()}));apply()})();
</script>
